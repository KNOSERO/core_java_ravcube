[versions]
# Blaze Persistence
blaze-persistence = "1.6.17"

# Shared libraries
commons-math3 = "3.6.1"
guava = "33.3.1-jre"
jackson-databind = "2.19.2"
idempotency4j = "0.1.0"

# Jakarta
jakarta-annotation = "2.1.1"
jakarta-persistence = "3.1.0"
jakarta-servlet = "6.0.0"

# QueryDSL
querydsl = "5.1.0"
postgresql = "42.7.4"
spring-framework = "6.2.11"
spring-boot = "3.5.6"
spring-cloud = "2025.0.1"
spring-kafka = "3.3.10"
nats-java = "2.26.2"

# Test and annotation tooling
awaitility = "4.3.0"
junit-jupiter = "5.10.2"
junit-jupiter-engine = "5.11.3"
junit-platform = "1.11.3"
lombok = "1.18.34"
mockito-core = "5.10.0"
testcontainers = "1.20.4"

[libraries]
# Blaze Persistence
blaze-api = { module = "com.blazebit:blaze-persistence-entity-view-api-jakarta", version.ref = "blaze-persistence" }
blaze-hibernate = { module = "com.blazebit:blaze-persistence-integration-hibernate-6.2", version.ref = "blaze-persistence" }
blaze-impl = { module = "com.blazebit:blaze-persistence-entity-view-impl-jakarta", version.ref = "blaze-persistence" }
blaze-processor = { module = "com.blazebit:blaze-persistence-entity-view-processor-jakarta", version.ref = "blaze-persistence" }
blaze-querydsl = { module = "com.blazebit:blaze-persistence-integration-querydsl-expressions-jakarta", version.ref = "blaze-persistence" }
blaze-spring = { module = "com.blazebit:blaze-persistence-integration-entity-view-spring-6.0", version.ref = "blaze-persistence" }

# Shared libraries
commons-math3 = { module = "org.apache.commons:commons-math3", version.ref = "commons-math3" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
idempotency-core = { module = "io.github.josipmusa:idempotency-core", version.ref = "idempotency4j" }
idempotency-inmemory = { module = "io.github.josipmusa:idempotency-inmemory", version.ref = "idempotency4j" }
idempotency-spring-boot-starter = { module = "io.github.josipmusa:idempotency-spring-boot-starter", version.ref = "idempotency4j" }
idempotency-spring-web = { module = "io.github.josipmusa:idempotency-spring-web", version.ref = "idempotency4j" }

# Jakarta
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakarta-annotation" }
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api", version.ref = "jakarta-persistence" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet" }

# QueryDSL
querydsl-apt = { module = "com.querydsl:querydsl-apt", version.ref = "querydsl" }
querydsl-core = { module = "com.querydsl:querydsl-core", version.ref = "querydsl" }
querydsl-jpa = { module = "com.querydsl:querydsl-jpa", version.ref = "querydsl" }

# Spring-managed dependencies
h2 = { module = "com.h2database:h2" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson-databind" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "spring-boot" }
spring-boot-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "spring-boot" }
spring-boot-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server", version.ref = "spring-boot" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-starter-eureka-client = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client" }
spring-cloud-starter-circuitbreaker-resilience4j = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j" }
spring-cloud-starter-loadbalancer = { module = "org.springframework.cloud:spring-cloud-starter-loadbalancer" }
spring-cloud-starter-openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign" }
spring-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring-boot" }
spring-data-elasticsearch = { module = "org.springframework.boot:spring-boot-starter-data-elasticsearch", version.ref = "spring-boot" }
spring-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis", version.ref = "spring-boot" }
spring-devtools = { module = "org.springframework.boot:spring-boot-devtools", version.ref = "spring-boot" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring-framework" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka", version.ref = "spring-kafka" }
spring-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
spring-tx = { module = "org.springframework:spring-tx", version.ref = "spring-framework" }
spring-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
nats-java = { module = "io.nats:jnats", version.ref = "nats-java" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:kafka", version.ref = "testcontainers" }
testcontainers-elasticsearch = { module = "org.testcontainers:elasticsearch", version.ref = "testcontainers" }

# Test and annotation tooling
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter-engine" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito-core" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.1.0" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency = { id = "io.spring.dependency-management", version = "1.1.6" }
