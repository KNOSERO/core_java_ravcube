spring:
  application:
    name: fault-tolerance-test
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 200
            readTimeout: 200
    loadbalancer:
      retry:
        enabled: false

ravcube:
  fault-tolerance:
    circuitbreaker:
      sliding-window-size: 2
      minimum-number-of-calls: 2
      failure-rate-threshold: 50
      wait-duration-in-open-state: 200ms
      permitted-number-of-calls-in-half-open-state: 1


