spring:
  config:
    activate:
      on-profile: redis
  data:
    redis:
      host: ${ravcube.redis.host}
      port: ${ravcube.redis.port}
      database: ${ravcube.redis.database}
      username: ${ravcube.redis.username}
      password: ${ravcube.redis.password}
      timeout: ${ravcube.redis.timeout}
